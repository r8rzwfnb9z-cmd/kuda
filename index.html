<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>куда?</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f3ee;
      color: #1d1d1d;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0 60px;
    }

    .emoji {
      font-size: 52px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 43px;
      line-height: 1.02;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.5;
      color: #707070;
      max-width: 390px;
      margin-bottom: 28px;
    }

    .start-button,
    .secondary-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 17px 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .start-button {
      background: #1d1d1d;
      color: white;
    }

    .secondary-button {
      background: #e8e3da;
      color: #1d1d1d;
      margin-top: 12px;
    }

    .start-button:active,
    .secondary-button:active,
    .choice:active {
      transform: scale(0.97);
    }

    .back-button {
      border: none;
      background: transparent;
      color: #777;
      font-size: 15px;
      padding: 0;
      margin-bottom: 24px;
      cursor: pointer;
      text-align: left;
    }

    .city-input {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 17px;
      background: white;
      color: #1d1d1d;
      margin-bottom: 12px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .choice {
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 16px 13px;
      background: white;
      color: #1d1d1d;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 68px;
    }

    .choice.selected {
      border-color: #1d1d1d;
      background: #e8e3da;
    }

    .progress {
      font-size: 13px;
      color: #999;
      margin-bottom: 18px;
    }

    .budget-card {
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 18px;
      background: white;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .budget-card.selected {
      border-color: #1d1d1d;
      background: #e8e3da;
    }

    .budget-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .budget-description {
      font-size: 13px;
      color: #777;
      line-height: 1.4;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 360px) {

      .choices {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }

    }

  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      куда?
    </div>

    <section class="hero" id="hero">

      <div class="emoji">🗺️</div>

      <h1>
        Куда<br>
        сегодня?
      </h1>

      <p class="subtitle">
        Расскажи, какой день тебе хочется —
        мы соберём маршрут с местами,
        едой, развлечениями и событиями.
      </p>

      <button class="start-button" onclick="startApp()">
        ✨ Создать маршрут
      </button>

    </section>

    <div class="footer">
      Твой день. Твой маршрут.
    </div>

  </main>


  <script>

    /*
      Все ответы пользователя
    */

    const userData = {
      city: "",
      moods: [],
      company: "",
      budget: ""
    };


    /*
      СТАРТ
    */

    function startApp() {

      document.getElementById("hero").innerHTML = `

        <div class="emoji">📍</div>

        <h1>
          Где ты<br>
          сегодня?
        </h1>

        <p class="subtitle">
          Выбери город, чтобы мы могли подобрать
          места, события и построить маршрут.
        </p>

        <button class="start-button" onclick="chooseCity()">
          📍 Определить местоположение
        </button>

        <button class="secondary-button" onclick="enterCity()">
          ⌨️ Ввести город
        </button>

      `;

    }


    /*
      ГЕОЛОКАЦИЯ — ПОКА ЗАГЛУШКА
    */

    function chooseCity() {

      alert(
        "Определение местоположения подключим следующим этапом 📍"
      );

    }


    /*
      ВВОД ГОРОДА
    */

    function enterCity() {

      document.getElementById("hero").innerHTML = `

        <button class="back-button" onclick="startApp()">
          ← Назад
        </button>

        <div class="emoji">🌆</div>

        <h1>
          Какой<br>
          город?
        </h1>

        <p class="subtitle">
          Напиши город, в котором хочешь провести свой день.
        </p>

        <input
          class="city-input"
          id="cityInput"
          type="text"
          placeholder="Например, Франкфурт"
        >

        <button class="start-button" onclick="saveCity()">
          Продолжить →
        </button>

      `;

      document.getElementById("cityInput").focus();

    }


    /*
      СОХРАНЯЕМ ГОРОД
    */

    function saveCity() {

      const city =
        document.getElementById("cityInput").value.trim();

      if (!city) {

        alert("Напиши название города 🙂");

        return;

      }

      userData.city = city;

      localStorage.setItem("city", city);

      showMoodScreen();

    }


    /*
      ЭКРАН ЖЕЛАНИЙ
    */

    function showMoodScreen() {

      document.getElementById("hero").innerHTML = `

        <button class="back-button" onclick="enterCity()">
          ← Назад
        </button>

        <div class="progress">
          Шаг 2 из 6
        </div>

        <div class="emoji">✨</div>

        <h1>
          Что тебе<br>
          хочется?
        </h1>

        <p class="subtitle">
          Выбери всё, что подходит.
          Мы учтём сочетание твоих желаний.
        </p>

        <div class="choices">

          <button class="choice"
            onclick="toggleMood(this, 'Перезагрузиться')">
            🌿 Перезагрузиться
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Время для себя')">
            🫶 Время для себя
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Выпустить энергию')">
            ⚡ Выпустить энергию
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Вдохновиться')">
            🎨 Вдохновиться
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Красиво провести вечер')">
            🍷 Красиво провести вечер
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Свидание')">
            💕 Устроить свидание
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Повеселиться с друзьями')">
            👯 Повеселиться с друзьями
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Узнать что-то новое')">
            🧠 Узнать что-то новое
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Найти красивые места')">
            📸 Найти красивые места
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Интересное событие')">
            🎭 Интересное событие
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Вкусно поесть')">
            🍜 Вкусно поесть
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Шопинг')">
            🛍️ Шопинг
          </button>

          <button class="choice"
            onclick="toggleMood(this, 'Необычное приключение')">
            🎲 Необычное приключение
          </button>

          <button class="choice"
            onclick="toggleSurprise(this)">
            ✨ Удиви меня
          </button>

        </div>

        <button class="start-button" onclick="nextFromMood()">
          Продолжить →
        </button>

      `;

    }


    /*
      МНОЖЕСТВЕННЫЙ ВЫБОР ЖЕЛАНИЙ
    */

    function toggleMood(button, mood) {

      const surpriseIndex =
        userData.moods.indexOf("Удиви меня");

      if (surpriseIndex !== -1) {

        userData.moods = [];

        document
          .querySelectorAll(".choice")
          .forEach(function(item) {

            item.classList.remove("selected");

          });

      }

      const index =
        userData.moods.indexOf(mood);

      if (index === -1) {

        userData.moods.push(mood);

        button.classList.add("selected");

      } else {

        userData.moods.splice(index, 1);

        button.classList.remove("selected");

      }

    }


    /*
      "УДИВИ МЕНЯ"
    */

    function toggleSurprise(button) {

      const index =
        userData.moods.indexOf("Удиви меня");

      if (index === -1) {

        userData.moods = ["Удиви меня"];

        document
          .querySelectorAll(".choice")
          .forEach(function(item) {

            item.classList.remove("selected");

          });

        button.classList.add("selected");

      } else {

        userData.moods = [];

        button.classList.remove("selected");

      }

    }


    /*
      ПОСЛЕ ЖЕЛАНИЙ → С КЕМ?
    */

    function nextFromMood() {

      if (userData.moods.length === 0) {

        alert(
          "Выбери хотя бы один вариант ✨"
        );

        return;

      }

      localStorage.setItem(
        "moods",
        JSON.stringify(userData.moods)
      );

      showCompanyScreen();

    }


    /*
      ЭКРАН "С КЕМ?"
    */

    function showCompanyScreen() {

      document.getElementById("hero").innerHTML = `

        <button class="back-button" onclick="showMoodScreen()">
          ← Назад
        </button>

        <div class="progress">
          Шаг 3 из 6
        </div>

        <div class="emoji">👯</div>

        <h1>
          С кем<br>
          отправляемся?
        </h1>

        <p class="subtitle">
          Это поможет подобрать подходящие места
          и активности.
        </p>

        <div class="choices">

          <button class="choice"
            onclick="selectCompany(this, 'Один / одна')">
            🧍 Один / одна
          </button>

          <button class="choice"
            onclick="selectCompany(this, 'На свидании')">
            💕 На свидании
          </button>

          <button class="choice"
            onclick="selectCompany(this, 'С друзьями')">
            👯 С друзьями
          </button>

          <button class="choice"
            onclick="selectCompany(this, 'С семьёй')">
            👨‍👩‍👧 С семьёй
          </button>

          <button class="choice"
            onclick="selectCompany(this, 'С кем-то особенным')">
            🧑‍🤝‍🧑 С кем-то особенным
          </button>

        </div>

        <button class="start-button" onclick="nextFromCompany()">
          Продолжить →
        </button>

      `;

    }


    /*
      ВЫБОР КОМПАНИИ
    */

    function selectCompany(button, company) {

      userData.company = company;

      document
        .querySelectorAll(".choice")
        .forEach(function(item) {

          item.classList.remove("selected");

        });

      button.classList.add("selected");

    }


    /*
      ПОСЛЕ "С КЕМ?" → БЮДЖЕТ
    */

    function nextFromCompany() {

      if (!userData.company) {

        alert(
          "Выбери, с кем ты отправляешься 🙂"
        );

        return;

      }

      localStorage.setItem(
        "company",
        userData.company
      );

      showBudgetScreen();

    }


    /*
      ЭКРАН БЮДЖЕТА
    */

    function showBudgetScreen() {

      document.getElementById("hero").innerHTML = `

        <button class="back-button" onclick="showCompanyScreen()">
          ← Назад
        </button>

        <div class="progress">
          Шаг 4 из 6
        </div>

        <div class="emoji">💰</div>

        <h1>
          Какой<br>
          бюджет?
        </h1>

        <p class="subtitle">
          Примерный бюджет на одного человека.
        </p>


        <div class="budget-card"
          onclick="selectBudget(this, 'Бесплатно')">

          <div class="budget-title">
            🆓 БЕСПЛАТНО
          </div>

          <div class="budget-description">
            Только бесплатные места и активности
          </div>

        </div>


        <div class="budget-card"
          onclick="selectBudget(this, 'До 1 500 ₽')">

          <div class="budget-title">
            💸 До 1 500 ₽
          </div>

        </div>


        <div class="budget-card"
          onclick="selectBudget(this, '1 500–3 000 ₽')">

          <div class="budget-title">
            💸 1 500–3 000 ₽
          </div>

        </div>


        <div class="budget-card"
          onclick="selectBudget(this, '3 000–5 000 ₽')">

          <div class="budget-title">
            💸 3 000–5 000 ₽
          </div>

        </div>


        <div class="budget-card"
          onclick="selectBudget(this, '5 000–10 000 ₽')">

          <div class="budget-title">
            💎 5 000–10 000 ₽
          </div>

        </div>


        <div class="budget-card"
          onclick="selectBudget(this, 'Неважно')">

          <div class="budget-title">
            ✨ Бюджет не важен
          </div>

        </div>


        <button
          class="start-button"
          onclick="nextFromBudget()"
          style="margin-top: 12px;"
        >
          Продолжить →
        </button>

      `;

    }


    /*
      ВЫБОР БЮДЖЕТА
    */

    function selectBudget(card, budget) {

      userData.budget = budget;

      document
        .querySelectorAll(".budget-card")
        .forEach(function(item) {

          item.classList.remove("selected");

        });

      card.classList.add("selected");

    }


    /*
      ПОСЛЕ БЮДЖЕТА
    */

    function nextFromBudget() {

      if (!userData.budget) {

        alert(
          "Выбери бюджет 💰"
        );

        return;

      }

      localStorage.setItem(
        "budget",
        userData.budget
      );


      alert(
        "Отлично! Бюджет: " +
        userData.budget +
        "\n\nСледующим шагом добавим время ⏱️"
      );

    }

  </script>

</body>
</html>
