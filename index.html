<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>куда?</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f6f3ee;

    color: #1d1d1d;

    min-height: 100vh;
}

.app {

    max-width: 520px;

    min-height: 100vh;

    margin: auto;

    padding: 24px 20px 32px;

    display: flex;

    flex-direction: column;
}

.logo {

    font-size: 22px;

    font-weight: 700;

}

.hero {

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 40px 0 60px;

}

.emoji {

    font-size: 52px;

    margin-bottom: 22px;

}

h1 {

    font-size: 43px;

    line-height: 1.02;

    letter-spacing: -2px;

    margin-bottom: 18px;

}

.subtitle {

    font-size: 17px;

    line-height: 1.5;

    color: #707070;

    margin-bottom: 28px;

}

button {

    font-family: inherit;

}

.start-button,
.secondary-button {

    width: 100%;

    border: none;

    border-radius: 18px;

    padding: 17px 18px;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

}

.start-button {

    background: #1d1d1d;

    color: white;

}

.secondary-button {

    background: #e8e3da;

    color: #1d1d1d;

    margin-top: 12px;

}

.back-button {

    border: none;

    background: transparent;

    color: #777;

    font-size: 15px;

    padding: 0;

    margin-bottom: 24px;

    text-align: left;

}

.city-input {

    width: 100%;

    border: none;

    outline: none;

    border-radius: 18px;

    padding: 18px 20px;

    font-size: 17px;

    background: white;

    margin-bottom: 12px;

}

.choices {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 22px;

}

.choice {

    border: 2px solid transparent;

    border-radius: 18px;

    padding: 16px 13px;

    background: white;

    font-size: 15px;

    font-weight: 600;

    text-align: left;

    cursor: pointer;

    min-height: 68px;

}

.choice.selected {

    border-color: #1d1d1d;

    background: #e8e3da;

}

.progress {

    font-size: 13px;

    color: #999;

    margin-bottom: 18px;

}

.budget-card,
.time-card {

    border: 2px solid transparent;

    border-radius: 20px;

    padding: 18px;

    background: white;

    margin-bottom: 10px;

    cursor: pointer;

}

.budget-card.selected,
.time-card.selected {

    border-color: #1d1d1d;

    background: #e8e3da;

}

.budget-title,
.time-title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 5px;

}

.budget-description,
.time-description {

    font-size: 13px;

    color: #777;

}

.place-card {

    background: white;

    border-radius: 20px;

    padding: 18px;

    margin-bottom: 12px;

}

.place-name {

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 7px;

}

.place-type {

    font-size: 14px;

    color: #777;

    margin-bottom: 6px;

}

.place-address {

    font-size: 13px;

    color: #999;

}

.loading {

    text-align: center;

    padding: 40px 10px;

    color: #777;

}

.footer {

    text-align: center;

    color: #999;

    font-size: 13px;

}

@media (max-width: 360px) {

    .choices {

        grid-template-columns: 1fr;

    }

    h1 {

        font-size: 38px;

    }

}

</style>

</head>


<body>

<main class="app">

<div class="logo">
куда?
</div>

<section
    class="hero"
    id="hero">

<div class="emoji">
🗺️
</div>

<h1>
Куда<br>
сегодня?
</h1>

<p class="subtitle">

Расскажи, какой день тебе хочется —
мы соберём маршрут с местами,
едой, развлечениями и событиями.

</p>

<button
    class="start-button"
    onclick="startApp()">

✨ Создать маршрут

</button>

</section>

<div class="footer">
Твой день. Твой маршрут.
</div>

</main>


<script>

/* =========================
TELEGRAM
========================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {

    tg.ready();

    tg.expand();

}


/* =========================
BACKEND
========================= */

const API_URL =
    "https://kuda-gm0k.onrender.com";


/* =========================
DATA
========================= */

const userData = {

    city: "",

    moods: [],

    company: "",

    budget: "",

    time: "",

    interests: [],

    locationMode: "",

    latitude: "",

    longitude: "",

    distance: ""

};

let citySearchMode = "";


/* =========================
START
========================= */

function startApp() {

    showLocationScreen();

}


/* =========================
LOCATION
========================= */

function showLocationScreen() {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            📍
        </div>

        <h1>
            Откуда<br>
            начинаем?
        </h1>

        <p class="subtitle">

            Мы можем найти маршрут рядом с тобой
            или построить его в выбранном городе.

        </p>

        <button
            class="start-button"
            onclick="useMyLocation()">

            📍 Использовать мою геолокацию

        </button>

        <button
            class="secondary-button"
            onclick="enterCity()">

            🏙️ Выбрать город

        </button>

    `;

}


/* =========================
GEOLOCATION
========================= */

function useMyLocation() {

    if (!tg) {

        alert(
            "Открой приложение внутри Telegram 📱"
        );

        return;

    }

    if (!tg.LocationManager) {

        alert(
            "Геолокация недоступна."
        );

        return;

    }

    tg.LocationManager.init(function() {

        tg.LocationManager.getLocation(
            function(location) {

                if (!location) {

                    alert(
                        "Разреши доступ к геолокации 📍"
                    );

                    return;

                }

                userData.locationMode =
                    "nearby";

                userData.latitude =
                    location.latitude;

                userData.longitude =
                    location.longitude;

                showDistanceScreen();

            }
        );

    });

}


/* =========================
DISTANCE
========================= */

function showDistanceScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()">

            ← Назад

        </button>

        <div class="emoji">
            📏
        </div>

        <h1>
            Насколько далеко<br>
            готова ехать?
        </h1>

        <p class="subtitle">
            Выбери максимальное расстояние.
        </p>

        <div
            class="time-card"
            onclick="selectDistance(this,'До 15 минут')">

            <div class="time-title">
                🚶 Рядом — до 15 минут
            </div>

        </div>

        <div
            class="time-card"
            onclick="selectDistance(this,'До 30 минут')">

            <div class="time-title">
                🚲 До 30 минут
            </div>

        </div>

        <div
            class="time-card"
            onclick="selectDistance(this,'До 60 минут')">

            <div class="time-title">
                🚇 До 60 минут
            </div>

        </div>

        <div
            class="time-card"
            onclick="selectDistance(this,'Где угодно в городе')">

            <div class="time-title">
                🌆 Где угодно в городе
            </div>

        </div>

        <button
            class="start-button"
            onclick="nextFromDistance()">

            Продолжить →

        </button>

    `;

}


function selectDistance(card, distance) {

    userData.distance = distance;

    document
        .querySelectorAll(".time-card")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    card.classList.add("selected");

}


function nextFromDistance() {

    if (!userData.distance) {

        alert("Выбери расстояние 📏");

        return;

    }

    showMoodScreen();

}


/* =========================
CITY
========================= */

function enterCity() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()">

            ← Назад

        </button>

        <div class="emoji">
            🌆
        </div>

        <h1>
            Какой<br>
            город?
        </h1>

        <p class="subtitle">
            Напиши город, в котором
            хочешь провести свой день.
        </p>

        <input
            class="city-input"
            id="cityInput"
            placeholder="Например, Москва">

        <button
            class="start-button"
            onclick="saveCity()">

            Продолжить →

        </button>

    `;

    document
        .getElementById("cityInput")
        .focus();

}


function saveCity() {

    const city =
        document
            .getElementById("cityInput")
            .value
            .trim();

    if (!city) {

        alert("Напиши название города 🙂");

        return;

    }

    userData.city = city;

    userData.locationMode = "city";

    showCitySearchMode();

}


function showCitySearchMode() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="enterCity()">

            ← Назад

        </button>

        <div class="emoji">
            🏙️
        </div>

        <h1>
            Где искать<br>
            маршрут?
        </h1>

        <p class="subtitle">
            Выбери область поиска.
        </p>

        <div
            class="time-card"
            onclick="selectCityMode(this,'Рядом с центром')">

            <div class="time-title">
                📍 Рядом с центром
            </div>

        </div>

        <div
            class="time-card"
            onclick="selectCityMode(this,'Весь город')">

            <div class="time-title">
                🌆 Весь город
            </div>

        </div>

        <button
            class="start-button"
            onclick="nextFromCityMode()">

            Продолжить →

        </button>

    `;

}


function selectCityMode(card, mode) {

    citySearchMode = mode;

    document
        .querySelectorAll(".time-card")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    card.classList.add("selected");

}


function nextFromCityMode() {

    if (!citySearchMode) {

        alert("Выбери, где искать маршрут 🏙️");

        return;

    }

    userData.distance = citySearchMode;

    showMoodScreen();

}


/* =========================
MOOD
========================= */

function showMoodScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()">

            ← Назад

        </button>

        <div class="progress">
            Шаг 2 из 6
        </div>

        <div class="emoji">
            ✨
        </div>

        <h1>
            Что тебе<br>
            хочется?
        </h1>

        <p class="subtitle">
            Выбери всё, что подходит.
        </p>

        <div class="choices">

            ${[
                "🌿 Перезагрузиться",
                "🫶 Время для себя",
                "⚡ Выпустить энергию",
                "🎨 Вдохновиться",
                "🍷 Красиво провести вечер",
                "💕 Свидание",
                "👯 Повеселиться с друзьями",
                "🧠 Узнать что-то новое",
                "📸 Найти красивые места",
                "🎭 Интересное событие",
                "🍜 Вкусно поесть",
                "🛍️ Шопинг",
                "🎲 Необычное приключение"
            ].map(function(text) {

                return `
                    <button
                        class="choice"
                        onclick="toggleMood(this,'${text.substring(2)}')">

                        ${text}

                    </button>
                `;

            }).join("")}

            <button
                class="choice"
                onclick="toggleSurpriseMood(this)">

                ✨ Удиви меня

            </button>

        </div>

        <button
            class="start-button"
            onclick="nextFromMood()">

            Продолжить →

        </button>

    `;

}


function toggleMood(button, mood) {

    if (
        userData.moods.includes("Удиви меня")
    ) {

        userData.moods = [];

        document
            .querySelectorAll(".choice")
            .forEach(function(item) {

                item.classList.remove("selected");

            });

    }

    const index =
        userData.moods.indexOf(mood);

    if (index === -1) {

        userData.moods.push(mood);

        button.classList.add("selected");

    } else {

        userData.moods.splice(index, 1);

        button.classList.remove("selected");

    }

}


function toggleSurpriseMood(button) {

    userData.moods = ["Удиви меня"];

    document
        .querySelectorAll(".choice")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    button.classList.add("selected");

}


function nextFromMood() {

    if (!userData.moods.length) {

        alert("Выбери хотя бы один вариант ✨");

        return;

    }

    showCompanyScreen();

}


/* =========================
COMPANY
========================= */

function showCompanyScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showMoodScreen()">

            ← Назад

        </button>

        <div class="progress">
            Шаг 3 из 6
        </div>

        <div class="emoji">
            👯
        </div>

        <h1>
            С кем<br>
            отправляемся?
        </h1>

        <p class="subtitle">
            Это поможет подобрать подходящие места.
        </p>

        <div class="choices">

            <button class="choice"
                onclick="selectCompany(this,'Один / одна')">
                🧍 Один / одна
            </button>

            <button class="choice"
                onclick="selectCompany(this,'На свидании')">
                💕 На свидании
            </button>

            <button class="choice"
                onclick="selectCompany(this,'С друзьями')">
                👯 С друзьями
            </button>

            <button class="choice"
                onclick="selectCompany(this,'С семьёй')">
                👨‍👩‍👧 С семьёй
            </button>

            <button class="choice"
                onclick="selectCompany(this,'С кем-то особенным')">
                🧑‍🤝‍🧑 С кем-то особенным
            </button>

        </div>

        <button
            class="start-button"
            onclick="nextFromCompany()">

            Продолжить →

        </button>

    `;

}


function selectCompany(button, company) {

    userData.company = company;

    document
        .querySelectorAll(".choice")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    button.classList.add("selected");

}


function nextFromCompany() {

    if (!userData.company) {

        alert("Выбери компанию 🙂");

        return;

    }

    showBudgetScreen();

}


/* =========================
BUDGET
========================= */

function showBudgetScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showCompanyScreen()">

            ← Назад

        </button>

        <div class="progress">
            Шаг 4 из 6
        </div>

        <div class="emoji">
            💰
        </div>

        <h1>
            Какой<br>
            бюджет?
        </h1>

        <p class="subtitle">
            Примерный бюджет на одного человека.
        </p>

        ${[
            "🆓 Бесплатно",
            "💸 До 1 500 ₽",
            "💸 1 500–3 000 ₽",
            "💸 3 000–5 000 ₽",
            "💎 5 000–10 000 ₽",
            "✨ Бюджет не важен"
        ].map(function(text) {

            return `
                <div
                    class="budget-card"
                    onclick="selectBudget(this,'${text.substring(2)}')">

                    <div class="budget-title">
                        ${text}
                    </div>

                </div>
            `;

        }).join("")}

        <button
            class="start-button"
            onclick="nextFromBudget()">

            Продолжить →

        </button>

    `;

}


function selectBudget(card, budget) {

    userData.budget = budget;

    document
        .querySelectorAll(".budget-card")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    card.classList.add("selected");

}


function nextFromBudget() {

    if (!userData.budget) {

        alert("Выбери бюджет 💰");

        return;

    }

    showTimeScreen();

}


/* =========================
TIME
========================= */

function showTimeScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showBudgetScreen()">

            ← Назад

        </button>

        <div class="progress">
            Шаг 5 из 6
        </div>

        <div class="emoji">
            ⏱️
        </div>

        <h1>
            Сколько у тебя<br>
            времени?
        </h1>

        <p class="subtitle">
            Подберём маршрут, который реально успеть пройти.
        </p>

        ${[
            "⚡ До 1 часа",
            "☕ 1–2 часа",
            "🌿 2–4 часа",
            "🌆 4–6 часов",
            "☀️ Почти весь день",
            "🌙 До позднего вечера",
            "✨ Неважно"
        ].map(function(text) {

            return `
                <div
                    class="time-card"
                    onclick="selectTime(this,'${text.substring(2)}')">

                    <div class="time-title">
                        ${text}
                    </div>

                </div>
            `;

        }).join("")}

        <button
            class="start-button"
            onclick="nextFromTime()">

            Продолжить →

        </button>

    `;

}


function selectTime(card, time) {

    userData.time = time;

    document
        .querySelectorAll(".time-card")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    card.classList.add("selected");

}


function nextFromTime() {

    if (!userData.time) {

        alert("Выбери время ⏱️");

        return;

    }

    showInterestScreen();

}


/* =========================
INTERESTS
========================= */

function showInterestScreen() {

    const interests = [

        "☕ Кофе и уютные места",
        "🍜 Еда",
        "🍸 Бары и вечеринки",
        "🎨 Искусство",
        "🎭 Театр и шоу",
        "🎵 Музыка",
        "🎬 Кино",
        "🌳 Природа",
        "📸 Красивые места",
        "🏛️ История",
        "🛍️ Шопинг",
        "🎮 Развлечения",
        "🧠 Образование",
        "🧖‍♀️ SPA и релакс",
        "🏃 Активности",
        "🎉 Актуальные мероприятия",
        "🎲 Что-нибудь необычное"
    ];

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showTimeScreen()">

            ← Назад

        </button>

        <div class="progress">
            Шаг 6 из 6
        </div>

        <div class="emoji">
            🎯
        </div>

        <h1>
            Что должно быть<br>
            в маршруте?
        </h1>

        <p class="subtitle">
            Можно выбрать несколько вариантов.
        </p>

        <div class="choices">

            ${interests.map(function(text) {

                return `
                    <button
                        class="choice"
                        onclick="toggleInterest(this,'${text.substring(2)}')">

                        ${text}

                    </button>
                `;

            }).join("")}

            <button
                class="choice"
                onclick="toggleSurpriseInterest(this)">

                ✨ Выбери за меня

            </button>

        </div>

        <button
            class="start-button"
            onclick="finishQuestionnaire()">

            ✨ Найти реальные места

        </button>

    `;

}


function toggleInterest(button, interest) {

    if (
        userData.interests.includes("Выбери за меня")
    ) {

        userData.interests = [];

        document
            .querySelectorAll(".choice")
            .forEach(function(item) {

                item.classList.remove("selected");

            });

    }

    const index =
        userData.interests.indexOf(interest);

    if (index === -1) {

        userData.interests.push(interest);

        button.classList.add("selected");

    } else {

        userData.interests.splice(index, 1);

        button.classList.remove("selected");

    }

}


function toggleSurpriseInterest(button) {

    userData.interests =
        ["Выбери за меня"];

    document
        .querySelectorAll(".choice")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

    button.classList.add("selected");

}


function finishQuestionnaire() {

    if (!userData.interests.length) {

        alert("Выбери хотя бы один интерес 🎯");

        return;

    }

    findPlaces();

}


/* =========================
FIND PLACES
========================= */

async function findPlaces() {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            🔎
        </div>

        <h1>
            Ищем<br>
            места...
        </h1>

        <div class="loading">

            Подбираем реальные места
            под твои желания 🗺️

        </div>

    `;


    const payload = {

        city:
            userData.city,

        latitude:
            userData.latitude,

        longitude:
            userData.longitude,

        moods:
            userData.moods,

        company:
            userData.company,

        budget:
            userData.budget,

        time:
            userData.time,

        interests:
            userData.interests,

        distance:
            userData.distance

    };


    try {

        const response =
            await fetch(
                API_URL + "/route",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Ошибка сервера"
            );

        }


        showPlaces(result.places || []);


    } catch (error) {

        console.error(error);

        document.getElementById("hero").innerHTML = `

            <div class="emoji">
                😔
            </div>

            <h1>
                Что-то<br>
                пошло не так
            </h1>

            <p class="subtitle">

                Не удалось получить места.
                Попробуй ещё раз.

                <br><br>

                ${error.message}

            </p>

            <button
                class="start-button"
                onclick="finishQuestionnaire()">

                🔄 Попробовать снова

            </button>

        `;

    }

}


/* =========================
SHOW PLACES
========================= */

function showPlaces(places) {

    if (!places.length) {

        document.getElementById("hero").innerHTML = `

            <div class="emoji">
                😔
            </div>

            <h1>
                Ничего<br>
                не нашли
            </h1>

            <p class="subtitle">

                Попробуем расширить область поиска.

            </p>

            <button
                class="start-button"
                onclick="findPlaces()">

                🔄 Найти ещё раз

            </button>

        `;

        return;

    }


    let html = `

        <button
            class="back-button"
            onclick="showInterestScreen()">

            ← Изменить запрос

        </button>

        <div class="emoji">
            📍
        </div>

        <h1>
            Нашли<br>
            ${places.length} мест
        </h1>

        <p class="subtitle">

            Вот что нашли рядом с тобой:

        </p>

    `;


    places.forEach(function(place) {

        html += `

            <div class="place-card">

                <div class="place-name">
                    ${escapeHtml(place.name)}
                </div>

                <div class="place-type">
                    ${escapeHtml(place.type)}
                </div>

                ${
                    place.address
                    ? `
                        <div class="place-address">
                            📍 ${escapeHtml(place.address)}
                        </div>
                    `
                    : ""
                }

            </div>

        `;

    });


    html += `

        <button
            class="start-button"
            onclick="alert('Следующий этап — построение маршрута между выбранными местами 🗺️')">

            🗺️ Построить маршрут

        </button>

    `;


    document.getElementById("hero").innerHTML =
        html;

}


/* =========================
SECURITY
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}

</script>
