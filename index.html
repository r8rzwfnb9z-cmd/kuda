<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>куда?</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f6f3ee;
    color: #1d1d1d;
    min-height: 100vh;
}

.app {
    max-width: 520px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 20px 32px;

    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: 700;
}

.hero {
    flex: 1;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 40px 0 60px;
}

.emoji {
    font-size: 52px;
    margin-bottom: 22px;
}

h1 {
    font-size: 43px;
    line-height: 1.02;
    letter-spacing: -2px;
    margin-bottom: 18px;
}

.subtitle {
    font-size: 17px;
    line-height: 1.5;
    color: #707070;
    margin-bottom: 28px;
}

button {
    font-family: inherit;
}

.start-button,
.secondary-button {

    width: 100%;
    border: none;
    border-radius: 18px;

    padding: 17px 18px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

.start-button {
    background: #1d1d1d;
    color: white;
}

.secondary-button {
    background: #e8e3da;
    color: #1d1d1d;

    margin-top: 12px;
}

.back-button {

    border: none;
    background: transparent;

    color: #777;

    font-size: 15px;

    padding: 0;
    margin-bottom: 24px;

    text-align: left;
}

.city-input {

    width: 100%;

    border: none;
    outline: none;

    border-radius: 18px;

    padding: 18px 20px;

    font-size: 17px;

    background: white;

    margin-bottom: 12px;
}

.choices {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 22px;
}

.choice {

    border: 2px solid transparent;

    border-radius: 18px;

    padding: 16px 13px;

    background: white;
    color: #1d1d1d;

    font-size: 15px;
    font-weight: 600;

    text-align: left;

    cursor: pointer;

    min-height: 68px;
}

.choice.selected {

    border-color: #1d1d1d;

    background: #e8e3da;
}

.progress {

    font-size: 13px;
    color: #999;

    margin-bottom: 18px;
}

.card {

    border: 2px solid transparent;

    border-radius: 20px;

    padding: 18px;

    background: white;

    margin-bottom: 10px;

    cursor: pointer;
}

.card.selected {

    border-color: #1d1d1d;

    background: #e8e3da;
}

.card-title {

    font-size: 16px;
    font-weight: 700;
}

.place-card {

    background: white;

    border-radius: 22px;

    padding: 18px;

    margin-bottom: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.04);
}

.place-name {

    font-size: 19px;
    font-weight: 700;

    margin-bottom: 8px;
}

.place-category {

    display: inline-block;

    background: #e8e3da;

    border-radius: 10px;

    padding: 5px 9px;

    font-size: 12px;

    margin-bottom: 10px;
}

.place-distance {

    font-size: 14px;

    color: #777;

    margin-bottom: 8px;
}

.place-address {

    font-size: 14px;

    color: #777;

    line-height: 1.4;

    margin-bottom: 12px;
}

.map-button {

    display: block;

    width: 100%;

    padding: 12px;

    border-radius: 13px;

    background: #f0ece5;

    color: #1d1d1d;

    text-decoration: none;

    text-align: center;

    font-size: 14px;

    font-weight: 600;
}

.loading {

    text-align: center;

    color: #777;

    line-height: 1.5;
}

.footer {

    text-align: center;

    color: #999;

    font-size: 13px;
}

.error-box {

    background: white;

    border-radius: 20px;

    padding: 20px;

    line-height: 1.5;

    margin-bottom: 15px;
}

.small-info {

    font-size: 13px;

    color: #999;

    margin-top: 10px;

    line-height: 1.4;
}

@media (max-width: 360px) {

    .choices {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 38px;
    }

}

</style>

</head>


<body>


<main class="app">

    <div class="logo">
        куда?
    </div>

    <section
        class="hero"
        id="hero"
    >

        <div class="emoji">
            🗺️
        </div>

        <h1>
            Куда<br>
            сегодня?
        </h1>

        <p class="subtitle">

            Расскажи, какой день тебе хочется —
            мы найдём реальные места
            под твой запрос.

        </p>

        <button
            class="start-button"
            onclick="startApp()"
        >

            ✨ Создать маршрут

        </button>

    </section>

    <div class="footer">
        Твой день. Твой маршрут.
    </div>

</main>


<script>


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

}


/* =====================================================
   BACKEND
===================================================== */

const API_URL =
    "https://kuda-gm0k.onrender.com";


/* =====================================================
   ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
===================================================== */

const userData = {

    city: "",

    moods: [],

    company: "",

    budget: "",

    time: "",

    interests: [],

    locationMode: "",

    latitude: null,

    longitude: null,

    distance: ""

};


/* =====================================================
   START
===================================================== */

function startApp() {

    showLocationScreen();

}


/* =====================================================
   ВЫБОР ЛОКАЦИИ
===================================================== */

function showLocationScreen() {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            📍
        </div>

        <h1>
            Откуда<br>
            начинаем?
        </h1>

        <p class="subtitle">

            Можно использовать геолокацию
            или просто написать город.

        </p>

        <button
            class="start-button"
            onclick="useMyLocation()"
        >

            📍 Использовать мою геолокацию

        </button>

        <button
            class="secondary-button"
            onclick="enterCity()"
        >

            🏙️ Ввести город вручную

        </button>

    `;

}


/* =====================================================
   ГЕОЛОКАЦИЯ TELEGRAM
===================================================== */

function useMyLocation() {

    if (!tg) {

        alert(
            "Открой приложение внутри Telegram 📱"
        );

        return;

    }

    if (!tg.LocationManager) {

        alert(
            "Геолокация Telegram недоступна. "
            + "Попробуй выбрать город вручную."
        );

        return;

    }

    tg.LocationManager.init(

        function() {

            tg.LocationManager.getLocation(

                function(location) {

                    if (!location) {

                        alert(
                            "Не удалось получить геолокацию. "
                            + "Попробуй выбрать город вручную."
                        );

                        return;

                    }

                    userData.locationMode =
                        "nearby";

                    userData.city =
                        "";

                    userData.latitude =
                        Number(location.latitude);

                    userData.longitude =
                        Number(location.longitude);

                    showDistanceScreen();

                }

            );

        }

    );

}


/* =====================================================
   РАССТОЯНИЕ ДЛЯ ГЕОЛОКАЦИИ
===================================================== */

function showDistanceScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()"
        >

            ← Назад

        </button>

        <div class="emoji">
            📏
        </div>

        <h1>
            Насколько далеко<br>
            готова ехать?
        </h1>

        <p class="subtitle">

            Выбери максимальное расстояние.

        </p>

        <div
            class="card"
            onclick="selectDistance(this,'До 15 минут')"
        >

            <div class="card-title">
                🚶 До 15 минут
            </div>

        </div>

        <div
            class="card"
            onclick="selectDistance(this,'До 30 минут')"
        >

            <div class="card-title">
                🚲 До 30 минут
            </div>

        </div>

        <div
            class="card"
            onclick="selectDistance(this,'До 60 минут')"
        >

            <div class="card-title">
                🚇 До 60 минут
            </div>

        </div>

        <div
            class="card"
            onclick="selectDistance(this,'Где угодно в городе')"
        >

            <div class="card-title">
                🌆 Где угодно в городе
            </div>

        </div>

        <button
            class="start-button"
            onclick="nextFromDistance()"
        >

            Продолжить →

        </button>

    `;

}


function selectDistance(
    card,
    distance
) {

    userData.distance =
        distance;

    document
        .querySelectorAll(".card")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    card.classList.add(
        "selected"
    );

}


function nextFromDistance() {

    if (!userData.distance) {

        alert(
            "Выбери расстояние 📏"
        );

        return;

    }

    showMoodScreen();

}


/* =====================================================
   РУЧНОЙ ВВОД ГОРОДА
===================================================== */

function enterCity() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()"
        >

            ← Назад

        </button>

        <div class="emoji">
            🌆
        </div>

        <h1>
            В каком<br>
            городе?
        </h1>

        <p class="subtitle">

            Напиши город, где хочешь
            провести день.

        </p>

        <input
            class="city-input"
            id="cityInput"
            type="text"
            autocomplete="address-level2"
            placeholder="Например, Москва"
        >

        <button
            class="start-button"
            onclick="saveCity()"
        >

            Продолжить →

        </button>

    `;

    setTimeout(
        function() {

            const input =
                document.getElementById(
                    "cityInput"
                );

            if (input) {
                input.focus();
            }

        },
        100
    );

}


function saveCity() {

    const input =
        document.getElementById(
            "cityInput"
        );

    const city =
        input
            ? input.value.trim()
            : "";

    if (!city) {

        alert(
            "Напиши название города 🙂"
        );

        return;

    }

    userData.city =
        city;

    userData.locationMode =
        "city";

    userData.latitude =
        null;

    userData.longitude =
        null;

    showCitySearchMode();

}


/* =====================================================
   ОБЛАСТЬ ПОИСКА ГОРОДА
===================================================== */

function showCitySearchMode() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="enterCity()"
        >

            ← Назад

        </button>

        <div class="emoji">
            🏙️
        </div>

        <h1>
            Где искать<br>
            места?
        </h1>

        <p class="subtitle">

            Выбери область поиска.

        </p>

        <div
            class="card"
            onclick="selectCityMode(
                this,
                'Рядом с центром'
            )"
        >

            <div class="card-title">
                📍 Рядом с центром
            </div>

        </div>

        <div
            class="card"
            onclick="selectCityMode(
                this,
                'Весь город'
            )"
        >

            <div class="card-title">
                🌆 Весь город
            </div>

        </div>

        <button
            class="start-button"
            onclick="nextFromCityMode()"
        >

            Продолжить →

        </button>

    `;

}


function selectCityMode(
    card,
    mode
) {

    userData.distance =
        mode;

    document
        .querySelectorAll(".card")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    card.classList.add(
        "selected"
    );

}


function nextFromCityMode() {

    if (!userData.distance) {

        alert(
            "Выбери область поиска 🏙️"
        );

        return;

    }

    showMoodScreen();

}


/* =====================================================
   НАСТРОЕНИЕ
===================================================== */

function showMoodScreen() {

    const moods = [

        "🌿 Перезагрузиться",
        "🫶 Время для себя",
        "⚡ Выпустить энергию",
        "🎨 Вдохновиться",
        "🍷 Красиво провести вечер",
        "💕 Свидание",
        "👯 Повеселиться с друзьями",
        "🧠 Узнать что-то новое",
        "📸 Найти красивые места",
        "🎭 Интересное событие",
        "🍜 Вкусно поесть",
        "🛍️ Шопинг",
        "🎲 Необычное приключение"

    ];

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()"
        >

            ← Назад

        </button>

        <div class="progress">
            Шаг 2 из 6
        </div>

        <div class="emoji">
            ✨
        </div>

        <h1>
            Что тебе<br>
            хочется?
        </h1>

        <p class="subtitle">
            Выбери всё, что подходит.
        </p>

        <div class="choices">

            ${moods.map(
                mood => {

                    const text =
                        mood.substring(2);

                    return `

                        <button
                            class="choice"
                            onclick="toggleMood(
                                this,
                                '${text}'
                            )"
                        >

                            ${mood}

                        </button>

                    `;

                }
            ).join("")}

            <button
                class="choice"
                onclick="selectSurpriseMood(this)"
            >

                ✨ Удиви меня

            </button>

        </div>

        <button
            class="start-button"
            onclick="nextFromMood()"
        >

            Продолжить →

        </button>

    `;

}


function toggleMood(
    button,
    mood
) {

    const index =
        userData.moods.indexOf(
            mood
        );

    if (index === -1) {

        userData.moods.push(
            mood
        );

        button.classList.add(
            "selected"
        );

    } else {

        userData.moods.splice(
            index,
            1
        );

        button.classList.remove(
            "selected"
        );

    }

}


function selectSurpriseMood(
    button
) {

    userData.moods =
        ["Удиви меня"];

    document
        .querySelectorAll(".choice")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

}


function nextFromMood() {

    if (!userData.moods.length) {

        alert(
            "Выбери хотя бы один вариант ✨"
        );

        return;

    }

    showCompanyScreen();

}


/* =====================================================
   КОМПАНИЯ
===================================================== */

function showCompanyScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showMoodScreen()"
        >

            ← Назад

        </button>

        <div class="progress">
            Шаг 3 из 6
        </div>

        <div class="emoji">
            👯
        </div>

        <h1>
            С кем<br>
            отправляемся?
        </h1>

        <div class="choices">

            <button
                class="choice"
                onclick="selectCompany(
                    this,
                    'Один / одна'
                )"
            >

                🧍 Один / одна

            </button>

            <button
                class="choice"
                onclick="selectCompany(
                    this,
                    'На свидании'
                )"
            >

                💕 На свидании

            </button>

            <button
                class="choice"
                onclick="selectCompany(
                    this,
                    'С друзьями'
                )"
            >

                👯 С друзьями

            </button>

            <button
                class="choice"
                onclick="selectCompany(
                    this,
                    'С семьёй'
                )"
            >

                👨‍👩‍👧 С семьёй

            </button>

        </div>

        <button
            class="start-button"
            onclick="nextFromCompany()"
        >

            Продолжить →

        </button>

    `;

}


function selectCompany(
    button,
    company
) {

    userData.company =
        company;

    document
        .querySelectorAll(".choice")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

}


function nextFromCompany() {

    if (!userData.company) {

        alert(
            "Выбери, с кем отправляешься 🙂"
        );

        return;

    }

    showBudgetScreen();

}


/* =====================================================
   БЮДЖЕТ
===================================================== */

function showBudgetScreen() {

    const budgets = [

        "Бесплатно",
        "До 1 500 ₽",
        "1 500–3 000 ₽",
        "3 000–5 000 ₽",
        "5 000–10 000 ₽",
        "Бюджет не важен"

    ];

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showCompanyScreen()"
        >

            ← Назад

        </button>

        <div class="progress">
            Шаг 4 из 6
        </div>

        <div class="emoji">
            💰
        </div>

        <h1>
            Какой<br>
            бюджет?
        </h1>

        <p class="subtitle">
            Примерный бюджет на одного человека.
        </p>

        ${budgets.map(
            budget => `

                <div
                    class="card"
                    onclick="selectBudget(
                        this,
                        '${budget}'
                    )"
                >

                    <div class="card-title">
                        ${budget}
                    </div>

                </div>

            `
        ).join("")}

        <button
            class="start-button"
            onclick="nextFromBudget()"
        >

            Продолжить →

        </button>

    `;

}


function selectBudget(
    card,
    budget
) {

    userData.budget =
        budget;

    document
        .querySelectorAll(".card")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    card.classList.add(
        "selected"
    );

}


function nextFromBudget() {

    if (!userData.budget) {

        alert(
            "Выбери бюджет 💰"
        );

        return;

    }

    showTimeScreen();

}


/* =====================================================
   ВРЕМЯ
===================================================== */

function showTimeScreen() {

    const times = [

        "До 1 часа",
        "1–2 часа",
        "2–4 часа",
        "4–6 часов",
        "Почти весь день",
        "До позднего вечера",
        "Неважно"

    ];

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showBudgetScreen()"
        >

            ← Назад

        </button>

        <div class="progress">
            Шаг 5 из 6
        </div>

        <div class="emoji">
            ⏱️
        </div>

        <h1>
            Сколько у тебя<br>
            времени?
        </h1>

        <p class="subtitle">
            Подберём маршрут, который реально успеть.
        </p>

        ${times.map(
            time => `

                <div
                    class="card"
                    onclick="selectTime(
                        this,
                        '${time}'
                    )"
                >

                    <div class="card-title">
                        ${time}
                    </div>

                </div>

            `
        ).join("")}

        <button
            class="start-button"
            onclick="nextFromTime()"
        >

            Продолжить →

        </button>

    `;

}


function selectTime(
    card,
    time
) {

    userData.time =
        time;

    document
        .querySelectorAll(".card")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    card.classList.add(
        "selected"
    );

}


function nextFromTime() {

    if (!userData.time) {

        alert(
            "Выбери время ⏱️"
        );

        return;

    }

    showInterestScreen();

}


/* =====================================================
   ИНТЕРЕСЫ
===================================================== */

function showInterestScreen() {

    const interests = [

        "Кофе и уютные места",
        "Еда",
        "Бары и вечеринки",
        "Искусство",
        "Театр и шоу",
        "Музыка",
        "Кино",
        "Природа",
        "Красивые места",
        "История",
        "Шопинг",
        "Развлечения",
        "Образование",
        "SPA и релакс",
        "Активности",
        "Актуальные мероприятия",
        "Что-нибудь необычное"

    ];

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showTimeScreen()"
        >

            ← Назад

        </button>

        <div class="progress">
            Шаг 6 из 6
        </div>

        <div class="emoji">
            🎯
        </div>

        <h1>
            Что должно быть<br>
            в маршруте?
        </h1>

        <p class="subtitle">
            Можно выбрать несколько вариантов.
        </p>

        <div class="choices">

            ${interests.map(
                interest => `

                    <button
                        class="choice"
                        onclick="toggleInterest(
                            this,
                            '${interest}'
                        )"
                    >

                        ${interest}

                    </button>

                `
            ).join("")}

            <button
                class="choice"
                onclick="selectSurpriseInterest(this)"
            >

                ✨ Выбери за меня

            </button>

        </div>

        <button
            class="start-button"
            onclick="findPlaces()"
        >

            🗺️ Найти реальные места

        </button>

    `;

}


function toggleInterest(
    button,
    interest
) {

    const index =
        userData.interests.indexOf(
            interest
        );

    if (index === -1) {

        userData.interests.push(
            interest
        );

        button.classList.add(
            "selected"
        );

    } else {

        userData.interests.splice(
            index,
            1
        );

        button.classList.remove(
            "selected"
        );

    }

}


function selectSurpriseInterest(
    button
) {

    userData.interests =
        ["Что-нибудь необычное"];

    document
        .querySelectorAll(".choice")
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

}


/* =====================================================
   ПОИСК
===================================================== */

async function findPlaces() {

    if (!userData.interests.length) {

        alert(
            "Выбери хотя бы один интерес 🎯"
        );

        return;

    }


    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            🔎
        </div>

        <h1>
            Ищем<br>
            реальные места...
        </h1>

        <p class="loading">

            Подбираем места под твой запрос 🗺️

            <br><br>

            Это может занять несколько секунд.

        </p>

    `;


    const data = {

        city:
            userData.city,

        latitude:
            userData.latitude,

        longitude:
            userData.longitude,

        moods:
            userData.moods,

        company:
            userData.company,

        budget:
            userData.budget,

        time:
            userData.time,

        interests:
            userData.interests,

        distance:
            userData.distance

    };


    console.log(
        "Отправляем на backend:",
        data
    );


    try {

        const response =
            await fetch(
                API_URL + "/route",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const text =
            await response.text();


        let result;


        try {

            result =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Сервер вернул некорректный ответ: "
                + text.substring(0, 200)
            );

        }


        console.log(
            "Ответ backend:",
            result
        );


        if (!response.ok) {

            throw new Error(
                result.error ||
                result.details ||
                "Ошибка сервера"
            );

        }


        if (
            !result.places ||
            !Array.isArray(result.places)
        ) {

            throw new Error(
                "Backend не вернул список мест."
            );

        }


        if (!result.places.length) {

            showNoPlaces();

            return;

        }


        showPlaces(
            result.places
        );


    } catch (error) {

        console.error(
            "Ошибка поиска:",
            error
        );


        document.getElementById("hero").innerHTML = `

            <div class="emoji">
                ❌
            </div>

            <h1>
                Не получилось
            </h1>

            <div class="error-box">

                ${escapeHtml(
                    error.message
                )}

                <br><br>

                Проверь интернет
                и попробуй ещё раз.

            </div>

            <button
                class="start-button"
                onclick="findPlaces()"
            >

                🔄 Попробовать снова

            </button>

            <button
                class="secondary-button"
                onclick="showLocationScreen()"
            >

                ← Начать заново

            </button>

        `;

    }

}


/* =====================================================
   РЕЗУЛЬТАТЫ
===================================================== */

function showPlaces(
    places
) {

    let html = `

        <button
            class="back-button"
            onclick="showInterestScreen()"
        >

            ← Изменить запрос

        </button>

        <div class="emoji">
            📍
        </div>

        <h1>
            Нашли<br>
            места!
        </h1>

        <p class="subtitle">

            Вот что удалось найти
            под твой запрос.

        </p>

    `;


    places.forEach(
        function(place) {

            let mapQuery;


            if (
                place.latitude != null &&
                place.longitude != null
            ) {

                mapQuery =
                    place.latitude +
                    "," +
                    place.longitude;

            } else {

                mapQuery =
                    place.name +
                    " " +
                    (
                        userData.city ||
                        ""
                    );

            }


            const mapUrl =
                "https://www.google.com/maps/search/?api=1&query="
                +
                encodeURIComponent(
                    mapQuery
                );


            html += `

                <div class="place-card">

                    <div class="place-name">

                        ${escapeHtml(
                            place.name ||
                            "Без названия"
                        )}

                    </div>

                    <div class="place-category">

                        ${escapeHtml(
                            place.category ||
                            "Место"
                        )}

                    </div>

                    ${
                        place.distance_km != null
                            ? `
                                <div class="place-distance">

                                    📍
                                    ${place.distance_km}
                                    км

                                </div>
                              `
                            : ""
                    }

                    ${
                        place.address
                            ? `
                                <div class="place-address">

                                    ${escapeHtml(
                                        place.address
                                    )}

                                </div>
                              `
                            : ""
                    }

                    <a
                        class="map-button"
                        href="${mapUrl}"
                        target="_blank"
                        rel="noopener"
                    >

                        🗺️ Открыть на карте

                    </a>

                </div>

            `;

        }
    );


    document.getElementById("hero").innerHTML =
        html;

}


/* =====================================================
   НИЧЕГО НЕ НАШЛИ
===================================================== */

function showNoPlaces() {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            😔
        </div>

        <h1>
            Пока ничего<br>
            не нашли
        </h1>

        <p class="subtitle">

            В выбранной области
            не оказалось подходящих мест.

            <br><br>

            Попробуй выбрать другие интересы
            или увеличить область поиска.

        </p>

        <button
            class="start-button"
            onclick="showInterestScreen()"
        >

            🎯 Изменить интересы

        </button>

        <button
            class="secondary-button"
            onclick="showLocationScreen()"
        >

            📍 Изменить город

        </button>

    `;

}


/* =====================================================
   БЕЗОПАСНЫЙ HTML
===================================================== */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}
