<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>куда?</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f6f3ee;
    color: #1d1d1d;

    min-height: 100vh;
}

.app {
    max-width: 520px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 20px 32px;

    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: 700;
}

.hero {
    flex: 1;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 40px 0 60px;
}

.emoji {
    font-size: 52px;
    margin-bottom: 22px;
}

h1 {
    font-size: 43px;
    line-height: 1.02;
    letter-spacing: -2px;
    margin-bottom: 18px;
}

.subtitle {
    font-size: 17px;
    line-height: 1.5;
    color: #707070;
    max-width: 390px;
    margin-bottom: 28px;
}

button {
    font-family: inherit;
}

.start-button,
.secondary-button {

    width: 100%;

    border: none;
    border-radius: 18px;

    padding: 17px 18px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition: transform .15s ease;
}

.start-button {
    background: #1d1d1d;
    color: white;
}

.secondary-button {
    background: #e8e3da;
    color: #1d1d1d;
    margin-top: 12px;
}

.start-button:active,
.secondary-button:active,
.choice:active,
.card:active {
    transform: scale(.97);
}

.back-button {
    border: none;
    background: transparent;
    color: #777;
    font-size: 15px;
    padding: 0;
    margin-bottom: 24px;
    cursor: pointer;
    text-align: left;
}

.city-input {
    width: 100%;
    border: none;
    outline: none;
    border-radius: 18px;
    padding: 18px 20px;
    font-size: 17px;
    background: white;
    color: #1d1d1d;
    margin-bottom: 12px;
}

.choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

.choice {
    border: 2px solid transparent;
    border-radius: 18px;
    padding: 16px 13px;

    background: white;
    color: #1d1d1d;

    font-size: 15px;
    font-weight: 600;

    text-align: left;
    cursor: pointer;

    min-height: 68px;
}

.choice.selected,
.card.selected {
    border-color: #1d1d1d;
    background: #e8e3da;
}

.progress {
    font-size: 13px;
    color: #999;
    margin-bottom: 18px;
}

.card {
    border: 2px solid transparent;
    border-radius: 20px;
    padding: 18px;

    background: white;

    margin-bottom: 10px;

    cursor: pointer;
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 5px;
}

.card-description {
    font-size: 13px;
    color: #777;
    line-height: 1.4;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 30px 0;
}

.spinner {
    font-size: 45px;
    animation: spin 1.5s linear infinite;
    display: inline-block;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.result-card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 12px;
}

.result-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
}

.result-text {
    color: #707070;
    line-height: 1.5;
}

@media (max-width: 360px) {

    .choices {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 38px;
    }
}

</style>
</head>

<body>

<main class="app">

<div class="logo">
    куда?
</div>

<section class="hero" id="hero">

    <div class="emoji">
        🗺️
    </div>

    <h1>
        Куда<br>
        сегодня?
    </h1>

    <p class="subtitle">
        Расскажи, какой день тебе хочется —
        мы соберём маршрут с местами,
        едой, развлечениями и событиями.
    </p>

    <button
        class="start-button"
        onclick="startApp()"
    >
        ✨ Создать маршрут
    </button>

</section>

<div class="footer">
    Твой день. Твой маршрут.
</div>

</main>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================
   BACKEND
========================= */

const API_URL =
    "https://kuda-gm0k.onrender.com";


/* =========================
   DATA
========================= */

const userData = {

    city: "",

    moods: [],

    company: "",

    budget: "",

    time: "",

    interests: [],

    locationMode: "",

    latitude: "",

    longitude: "",

    distance: ""

};

let citySearchMode = "";


/* =========================
   START
========================= */

function startApp() {

    showLocationScreen();

}


/* =========================
   LOCATION
========================= */

function showLocationScreen() {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            📍
        </div>

        <h1>
            Откуда<br>
            начинаем?
        </h1>

        <p class="subtitle">
            Мы можем найти маршрут рядом с тобой
            или построить его в выбранном городе.
        </p>

        <button
            class="start-button"
            onclick="useMyLocation()"
        >
            📍 Использовать мою геолокацию
        </button>

        <button
            class="secondary-button"
            onclick="enterCity()"
        >
            🏙️ Выбрать город
        </button>

    `;

}


/* =========================
   GEOLOCATION
========================= */

function useMyLocation() {

    if (!tg) {

        alert(
            "Открой приложение внутри Telegram 📱"
        );

        return;
    }

    if (!tg.LocationManager) {

        alert(
            "Геолокация недоступна."
        );

        return;
    }

    tg.LocationManager.init(function() {

        tg.LocationManager.getLocation(
            function(location) {

                if (!location) {

                    alert(
                        "Не удалось получить геолокацию. Разреши доступ к местоположению 📍"
                    );

                    return;
                }

                userData.locationMode =
                    "nearby";

                userData.latitude =
                    location.latitude;

                userData.longitude =
                    location.longitude;

                showDistanceScreen();

            }
        );

    });

}


/* =========================
   DISTANCE
========================= */

function showDistanceScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()"
        >
            ← Назад
        </button>

        <div class="emoji">
            📏
        </div>

        <h1>
            Насколько далеко<br>
            готова ехать?
        </h1>

        <p class="subtitle">
            Выбери удобное расстояние.
        </p>

        <div
            class="card"
            onclick="selectDistance(this,'До 15 минут')"
        >
            <div class="card-title">
                🚶 Рядом — до 15 минут
            </div>

            <div class="card-description">
                Максимально близко к тебе
            </div>
        </div>

        <div
            class="card"
            onclick="selectDistance(this,'До 30 минут')"
        >
            <div class="card-title">
                🚲 До 30 минут
            </div>

            <div class="card-description">
                Можно немного отдалиться
            </div>
        </div>

        <div
            class="card"
            onclick="selectDistance(this,'До 60 минут')"
        >
            <div class="card-title">
                🚇 До 60 минут
            </div>

            <div class="card-description">
                Больше вариантов по городу
            </div>
        </div>

        <div
            class="card"
            onclick="selectDistance(this,'Где угодно в городе')"
        >
            <div class="card-title">
                🌆 Где угодно в городе
            </div>

            <div class="card-description">
                Расстояние не имеет значения
            </div>
        </div>

        <button
            class="start-button"
            onclick="nextFromDistance()"
        >
            Продолжить →
        </button>

    `;

}


function selectDistance(card, distance) {

    userData.distance =
        distance;

    document
        .querySelectorAll(".card")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    card.classList.add(
        "selected"
    );

}


function nextFromDistance() {

    if (!userData.distance) {

        alert(
            "Выбери расстояние 📏"
        );

        return;
    }

    showMoodScreen();

}


/* =========================
   CITY
========================= */

function enterCity() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()"
        >
            ← Назад
        </button>

        <div class="emoji">
            🌆
        </div>

        <h1>
            Какой<br>
            город?
        </h1>

        <p class="subtitle">
            Напиши город, в котором
            хочешь провести свой день.
        </p>

        <input
            class="city-input"
            id="cityInput"
            type="text"
            placeholder="Например, Варшава"
        >

        <button
            class="start-button"
            onclick="saveCity()"
        >
            Продолжить →
        </button>

    `;

}


function saveCity() {

    const city =
        document
            .getElementById("cityInput")
            .value
            .trim();

    if (!city) {

        alert(
            "Напиши название города 🙂"
        );

        return;
    }

    userData.city =
        city;

    userData.locationMode =
        "city";

    showCitySearchMode();

}


function showCitySearchMode() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="enterCity()"
        >
            ← Назад
        </button>

        <div class="emoji">
            🏙️
        </div>

        <h1>
            Где искать<br>
            маршрут?
        </h1>

        <p class="subtitle">
            Выбери радиус поиска.
        </p>

        <div
            class="card"
            onclick="selectCityMode(this,'Рядом с центром')"
        >
            <div class="card-title">
                📍 Рядом с центром
            </div>

            <div class="card-description">
                Компактный маршрут
            </div>
        </div>

        <div
            class="card"
            onclick="selectCityMode(this,'Весь город')"
        >
            <div class="card-title">
                🌆 Весь город
            </div>

            <div class="card-description">
                Ищем по всему городу
            </div>
        </div>

        <button
            class="start-button"
            onclick="nextFromCityMode()"
        >
            Продолжить →
        </button>

    `;

}


function selectCityMode(card, mode) {

    citySearchMode =
        mode;

    document
        .querySelectorAll(".card")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    card.classList.add(
        "selected"
    );

}


function nextFromCityMode() {

    if (!citySearchMode) {

        alert(
            "Выбери, где искать маршрут 🏙️"
        );

        return;
    }

    userData.distance =
        citySearchMode;

    showMoodScreen();

}


/* =========================
   MOOD
========================= */

function showMoodScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showLocationScreen()"
        >
            ← Назад
        </button>

        <div class="progress">
            Шаг 2 из 6
        </div>

        <div class="emoji">
            ✨
        </div>

        <h1>
            Что тебе<br>
            хочется?
        </h1>

        <p class="subtitle">
            Выбери всё, что подходит.
        </p>

        <div class="choices">

            ${moodButton("🌿","Перезагрузиться")}
            ${moodButton("🫶","Время для себя")}
            ${moodButton("⚡","Выпустить энергию")}
            ${moodButton("🎨","Вдохновиться")}
            ${moodButton("🍷","Красиво провести вечер")}
            ${moodButton("💕","Свидание")}
            ${moodButton("👯","Повеселиться с друзьями")}
            ${moodButton("🧠","Узнать что-то новое")}
            ${moodButton("📸","Найти красивые места")}
            ${moodButton("🎭","Интересное событие")}
            ${moodButton("🍜","Вкусно поесть")}
            ${moodButton("🛍️","Шопинг")}
            ${moodButton("🎲","Необычное приключение")}

            <button
                class="choice"
                onclick="toggleSurpriseMood(this)"
            >
                ✨ Удиви меня
            </button>

        </div>

        <button
            class="start-button"
            onclick="nextFromMood()"
        >
            Продолжить →
        </button>

    `;

}


function moodButton(emoji, text) {

    return `

        <button
            class="choice"
            onclick="toggleMood(this,'${text}')"
        >
            ${emoji} ${text}
        </button>

    `;

}


function toggleMood(button, mood) {

    if (
        userData.moods.includes(
            "Удиви меня"
        )
    ) {

        userData.moods = [];

        document
            .querySelectorAll(".choice")
            .forEach(function(item) {

                item.classList.remove(
                    "selected"
                );

            });

    }

    const index =
        userData.moods.indexOf(
            mood
        );

    if (index === -1) {

        userData.moods.push(
            mood
        );

        button.classList.add(
            "selected"
        );

    } else {

        userData.moods.splice(
            index,
            1
        );

        button.classList.remove(
            "selected"
        );

    }

}


function toggleSurpriseMood(button) {

    userData.moods =
        ["Удиви меня"];

    document
        .querySelectorAll(".choice")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    button.classList.add(
        "selected"
    );

}


function nextFromMood() {

    if (
        userData.moods.length === 0
    ) {

        alert(
            "Выбери хотя бы один вариант ✨"
        );

        return;
    }

    showCompanyScreen();

}


/* =========================
   COMPANY
========================= */

function showCompanyScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showMoodScreen()"
        >
            ← Назад
        </button>

        <div class="progress">
            Шаг 3 из 6
        </div>

        <div class="emoji">
            👯
        </div>

        <h1>
            С кем<br>
            отправляемся?
        </h1>

        <p class="subtitle">
            Это поможет подобрать подходящие места.
        </p>

        <div class="choices">

            ${companyButton("🧍","Один / одна")}
            ${companyButton("💕","На свидании")}
            ${companyButton("👯","С друзьями")}
            ${companyButton("👨‍👩‍👧","С семьёй")}
            ${companyButton("🧑‍🤝‍🧑","С кем-то особенным")}

        </div>

        <button
            class="start-button"
            onclick="nextFromCompany()"
        >
            Продолжить →
        </button>

    `;

}


function companyButton(emoji, text) {

    return `

        <button
            class="choice"
            onclick="selectCompany(this,'${text}')"
        >
            ${emoji} ${text}
        </button>

    `;

}


function selectCompany(button, company) {

    userData.company =
        company;

    document
        .querySelectorAll(".choice")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    button.classList.add(
        "selected"
    );

}


function nextFromCompany() {

    if (!userData.company) {

        alert(
            "Выбери, с кем ты отправляешься 🙂"
        );

        return;
    }

    showBudgetScreen();

}


/* =========================
   BUDGET
========================= */

function showBudgetScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showCompanyScreen()"
        >
            ← Назад
        </button>

        <div class="progress">
            Шаг 4 из 6
        </div>

        <div class="emoji">
            💰
        </div>

        <h1>
            Какой<br>
            бюджет?
        </h1>

        <p class="subtitle">
            Примерный бюджет на одного человека.
        </p>

        ${budgetCard("🆓","БЕСПЛАТНО")}
        ${budgetCard("💸","До 1 500 ₽")}
        ${budgetCard("💸","1 500–3 000 ₽")}
        ${budgetCard("💸","3 000–5 000 ₽")}
        ${budgetCard("💎","5 000–10 000 ₽")}
        ${budgetCard("✨","Бюджет не важен")}

        <button
            class="start-button"
            onclick="nextFromBudget()"
        >
            Продолжить →
        </button>

    `;

}


function budgetCard(emoji, text) {

    return `

        <div
            class="card"
            onclick="selectBudget(this,'${text}')"
        >
            <div class="card-title">
                ${emoji} ${text}
            </div>
        </div>

    `;

}


function selectBudget(card, budget) {

    userData.budget =
        budget;

    document
        .querySelectorAll(".card")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    card.classList.add(
        "selected"
    );

}


function nextFromBudget() {

    if (!userData.budget) {

        alert(
            "Выбери бюджет 💰"
        );

        return;
    }

    showTimeScreen();

}


/* =========================
   TIME
========================= */

function showTimeScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showBudgetScreen()"
        >
            ← Назад
        </button>

        <div class="progress">
            Шаг 5 из 6
        </div>

        <div class="emoji">
            ⏱️
        </div>

        <h1>
            Сколько у тебя<br>
            времени?
        </h1>

        <p class="subtitle">
            Мы подберём маршрут,
            который реально успеть пройти.
        </p>

        ${timeCard("⚡","До 1 часа")}
        ${timeCard("☕","1–2 часа")}
        ${timeCard("🌿","2–4 часа")}
        ${timeCard("🌆","4–6 часов")}
        ${timeCard("☀️","Почти весь день")}
        ${timeCard("🌙","До позднего вечера")}
        ${timeCard("✨","Неважно")}

        <button
            class="start-button"
            onclick="nextFromTime()"
        >
            Продолжить →
        </button>

    `;

}


function timeCard(emoji, text) {

    return `

        <div
            class="card"
            onclick="selectTime(this,'${text}')"
        >
            <div class="card-title">
                ${emoji} ${text}
            </div>
        </div>

    `;

}


function selectTime(card, time) {

    userData.time =
        time;

    document
        .querySelectorAll(".card")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    card.classList.add(
        "selected"
    );

}


function nextFromTime() {

    if (!userData.time) {

        alert(
            "Выбери, сколько у тебя времени ⏱️"
        );

        return;
    }

    showInterestScreen();

}


/* =========================
   INTERESTS
========================= */

function showInterestScreen() {

    document.getElementById("hero").innerHTML = `

        <button
            class="back-button"
            onclick="showTimeScreen()"
        >
            ← Назад
        </button>

        <div class="progress">
            Шаг 6 из 6
        </div>

        <div class="emoji">
            🎯
        </div>

        <h1>
            Что должно быть<br>
            в маршруте?
        </h1>

        <p class="subtitle">
            Можно выбрать несколько вариантов.
        </p>

        <div class="choices">

            ${interestButton("☕","Кофе и уютные места")}
            ${interestButton("🍜","Еда")}
            ${interestButton("🍸","Бары и вечеринки")}
            ${interestButton("🎨","Искусство")}
            ${interestButton("🎭","Театр и шоу")}
            ${interestButton("🎵","Музыка")}
            ${interestButton("🎬","Кино")}
            ${interestButton("🌳","Природа")}
            ${interestButton("📸","Красивые места")}
            ${interestButton("🏛️","История и достопримечательности")}
            ${interestButton("🛍️","Шопинг")}
            ${interestButton("🎮","Развлечения")}
            ${interestButton("🧠","Образование")}
            ${interestButton("🧖‍♀️","SPA и релакс")}
            ${interestButton("🏃","Активности")}
            ${interestButton("🎉","Актуальные мероприятия")}
            ${interestButton("🎲","Что-нибудь необычное")}

            <button
                class="choice"
                onclick="toggleSurpriseInterest(this)"
            >
                ✨ Выбери за меня
            </button>

        </div>

        <button
            class="start-button"
            onclick="finishQuestionnaire()"
        >
            ✨ Создать мой маршрут
        </button>

    `;

}


function interestButton(emoji, text) {

    return `

        <button
            class="choice"
            onclick="toggleInterest(this,'${text}')"
        >
            ${emoji} ${text}
        </button>

    `;

}


function toggleInterest(button, interest) {

    if (
        userData.interests.includes(
            "Выбери за меня"
        )
    ) {

        userData.interests = [];

        document
            .querySelectorAll(".choice")
            .forEach(function(item) {

                item.classList.remove(
                    "selected"
                );

            });

    }

    const index =
        userData.interests.indexOf(
            interest
        );

    if (index === -1) {

        userData.interests.push(
            interest
        );

        button.classList.add(
            "selected"
        );

    } else {

        userData.interests.splice(
            index,
            1
        );

        button.classList.remove(
            "selected"
        );

    }

}


function toggleSurpriseInterest(button) {

    userData.interests =
        ["Выбери за меня"];

    document
        .querySelectorAll(".choice")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });

    button.classList.add(
        "selected"
    );

}


/* =========================
   SEND TO BACKEND
========================= */

async function finishQuestionnaire() {

    if (
        userData.interests.length === 0
    ) {

        alert(
            "Выбери хотя бы один интерес 🎯"
        );

        return;
    }


    document.getElementById("hero").innerHTML = `

        <div class="loading">

            <div class="emoji">
                🗺️
            </div>

            <h1>
                Создаём<br>
                маршрут...
            </h1>

            <p class="subtitle">
                Подбираем варианты специально для тебя.
            </p>

            <div class="spinner">
                ✨
            </div>

        </div>

    `;


    const payload = {

        city:
            userData.city,

        latitude:
            userData.latitude,

        longitude:
            userData.longitude,

        moods:
            userData.moods,

        company:
            userData.company,

        budget:
            userData.budget,

        time:
            userData.time,

        interests:
            userData.interests,

        distance:
            userData.distance

    };


    try {

        const response =
            await fetch(
                API_URL + "/route",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        if (!response.ok) {

            throw new Error(
                "Ошибка сервера"
            );

        }


        const data =
            await response.json();


        showResult(data);


    } catch (error) {

        console.error(error);

        showError();

    }

}


/* =========================
   RESULT
========================= */

function showResult(data) {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            🎉
        </div>

        <h1>
            Запрос<br>
            получен!
        </h1>

        <p class="subtitle">
            Backend успешно получил твои параметры.
        </p>

        <div class="result-card">

            <div class="result-title">
                📍 Место
            </div>

            <div class="result-text">
                ${
                    userData.locationMode === "nearby"
                    ? "По твоей геолокации"
                    : userData.city
                }
            </div>

        </div>

        <div class="result-card">

            <div class="result-title">
                ✨ Настроение
            </div>

            <div class="result-text">
                ${userData.moods.join(", ")}
            </div>

        </div>

        <div class="result-card">

            <div class="result-title">
                🎯 Интересы
            </div>

            <div class="result-text">
                ${userData.interests.join(", ")}
            </div>

        </div>

        <div class="result-card">

            <div class="result-title">
                📏 Расстояние
            </div>

            <div class="result-text">
                ${userData.distance}
            </div>

        </div>

        <button
            class="start-button"
            onclick="startApp()"
        >
            🔄 Создать новый маршрут
        </button>

    `;

}


/* =========================
   ERROR
========================= */

function showError() {

    document.getElementById("hero").innerHTML = `

        <div class="emoji">
            😔
        </div>

        <h1>
            Что-то<br>
            пошло не так
        </h1>

        <p class="subtitle">
            Не удалось связаться с сервером.
            Проверь интернет и попробуй ещё раз.
        </p>

        <button
            class="start-button"
            onclick="finishQuestionnaire()"
        >
            🔄 Попробовать снова
        </button>

    `;

}

</script>
