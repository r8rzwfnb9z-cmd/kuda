<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>куда?</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f3ee;
      color: #1d1d1d;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 80px;
    }

    .emoji {
      font-size: 58px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 48px;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.5;
      color: #666;
      max-width: 360px;
      margin-bottom: 36px;
    }

    .start-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      background: #1d1d1d;
      color: white;
      transition: transform 0.15s ease;
    }

    .start-button:active {
      transform: scale(0.97);
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      куда?
    </div>

    <section class="hero">

      <div class="emoji">🗺️</div>

      <h1>Куда<br>сегодня?</h1>

      <p class="subtitle">
        Расскажи, какой день тебе хочется —
        мы соберём маршрут с местами,
        едой, развлечениями и событиями.
      </p>

      <button class="start-button" onclick="startApp()">
        ✨ Создать маршрут
      </button>

    </section>

    <div class="footer">
      Твой день. Твой маршрут.
    </div>

  </main>

  <script>
    function startApp() {
      alert("Отлично! Сейчас начнём создавать твой маршрут ✨");
    }
  </script>

</body>
</html>
