<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>куда?</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f6f3ee;
      color: #1d1d1d;

      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 32px;

      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .hero {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 40px 0 60px;
    }

    .emoji {
      font-size: 52px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 43px;
      line-height: 1.02;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.5;
      color: #707070;
      max-width: 390px;
      margin-bottom: 28px;
    }

    button {
      font-family: inherit;
    }

    .start-button,
    .secondary-button {

      width: 100%;

      border: none;
      border-radius: 18px;

      padding: 17px 18px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: transform .15s ease;
    }

    .start-button {
      background: #1d1d1d;
      color: white;
    }

    .secondary-button {
      background: #e8e3da;
      color: #1d1d1d;
      margin-top: 12px;
    }

    .start-button:active,
    .secondary-button:active,
    .choice:active,
    .budget-card:active,
    .time-card:active {
      transform: scale(.97);
    }

    .back-button {
      border: none;
      background: transparent;
      color: #777;
      font-size: 15px;
      padding: 0;
      margin-bottom: 24px;
      cursor: pointer;
      text-align: left;
    }

    .city-input {

      width: 100%;

      border: none;
      outline: none;

      border-radius: 18px;

      padding: 18px 20px;

      font-size: 17px;

      background: white;
      color: #1d1d1d;

      margin-bottom: 12px;
    }

    .choices {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 22px;
    }

    .choice {

      border: 2px solid transparent;

      border-radius: 18px;

      padding: 16px 13px;

      background: white;
      color: #1d1d1d;

      font-size: 15px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;

      transition: all .15s ease;

      min-height: 68px;
    }

    .choice.selected {

      border-color: #1d1d1d;

      background: #e8e3da;
    }

    .progress {

      font-size: 13px;

      color: #999;

      margin-bottom: 18px;
    }

    .budget-card,
    .time-card {

      border: 2px solid transparent;

      border-radius: 20px;

      padding: 18px;

      background: white;

      margin-bottom: 10px;

      cursor: pointer;

      transition: all .15s ease;
    }

    .budget-card.selected,
    .time-card.selected {

      border-color: #1d1d1d;

      background: #e8e3da;
    }

    .budget-title,
    .time-title {

      font-size: 16px;

      font-weight: 700;

      margin-bottom: 5px;
    }

    .budget-description,
    .time-description {

      font-size: 13px;

      color: #777;

      line-height: 1.4;
    }

    .footer {

      text-align: center;

      color: #999;

      font-size: 13px;
    }

    .loading {

      text-align: center;

      padding: 20px;

      font-size: 17px;

      color: #707070;
    }

    .error-box {

      background: #fff;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 20px;

      line-height: 1.5;

      color: #555;
    }

    @media (max-width: 360px) {

      .choices {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }

    }

  </style>

</head>

<body>

<main class="app">

  <div class="logo">
    куда?
  </div>

  <section
    class="hero"
    id="hero"
  >

    <div class="emoji">
      🗺️
    </div>

    <h1>
      Куда<br>
      сегодня?
    </h1>

    <p class="subtitle">

      Расскажи, какой день тебе хочется —
      мы соберём маршрут с местами,
      едой, развлечениями и событиями.

    </p>

    <button
      class="start-button"
      onclick="startApp()"
    >

      ✨ Создать маршрут

    </button>

  </section>

  <div class="footer">

    Твой день. Твой маршрут.

  </div>

</main>

<script>

/* =========================
   TELEGRAM
========================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {

  tg.ready();

  tg.expand();

}


/* =========================
   BACKEND
========================= */

const BACKEND_URL =
  "https://kuda-gm0k.onrender.com";


/* =========================
   DATA
========================= */

const userData = {

  city: "",

  moods: [],

  company: "",

  budget: "",

  time: "",

  interests: [],

  locationMode: "",

  latitude: null,

  longitude: null,

  distance: ""

};


let citySearchMode = "";


/* =========================
   START
========================= */

function startApp() {

  showLocationScreen();

}


/* =========================
   LOCATION
========================= */

function showLocationScreen() {

  document.getElementById("hero").innerHTML = `

    <div class="emoji">
      📍
    </div>

    <h1>
      Откуда<br>
      начинаем?
    </h1>

    <p class="subtitle">

      Мы можем найти маршрут рядом с тобой
      или построить его в любом выбранном городе.

    </p>

    <button
      class="start-button"
      onclick="useMyLocation()"
    >

      📍 Использовать мою геолокацию

    </button>

    <button
      class="secondary-button"
      onclick="enterCity()"
    >

      🏙️ Выбрать город

    </button>

  `;

}


/* =========================
   GEOLOCATION
========================= */

function useMyLocation() {

  if (!tg) {

    alert(
      "Открой приложение внутри Telegram 📱"
    );

    return;

  }

  if (!tg.LocationManager) {

    alert(
      "Геолокация недоступна. Обнови Telegram и попробуй снова."
    );

    return;

  }

  tg.LocationManager.init(function() {

    tg.LocationManager.getLocation(
      function(location) {

        if (!location) {

          alert(
            "Не удалось получить геолокацию. Разреши доступ к местоположению и попробуй ещё раз 📍"
          );

          return;

        }

        userData.locationMode =
          "nearby";

        userData.latitude =
          location.latitude;

        userData.longitude =
          location.longitude;

        showDistanceScreen();

      }
    );

  });

}


/* =========================
   DISTANCE
========================= */

function showDistanceScreen() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="showLocationScreen()"
    >

      ← Назад

    </button>

    <div class="emoji">
      📏
    </div>

    <h1>
      Насколько далеко<br>
      готова ехать?
    </h1>

    <p class="subtitle">

      Можно искать только рядом
      или разрешить нам искать по всему городу.

    </p>

    <div
      class="time-card"
      onclick="selectDistance(this,'До 15 минут')"
    >

      <div class="time-title">
        🚶 Рядом — до 15 минут
      </div>

      <div class="time-description">
        Максимально близко к тебе
      </div>

    </div>

    <div
      class="time-card"
      onclick="selectDistance(this,'До 30 минут')"
    >

      <div class="time-title">
        🚲 До 30 минут
      </div>

      <div class="time-description">
        Можно немного отдалиться
      </div>

    </div>

    <div
      class="time-card"
      onclick="selectDistance(this,'До 60 минут')"
    >

      <div class="time-title">
        🚇 До 60 минут
      </div>

      <div class="time-description">
        Больше вариантов по городу
      </div>

    </div>

    <div
      class="time-card"
      onclick="selectDistance(this,'Где угодно в городе')"
    >

      <div class="time-title">
        🌆 Где угодно в городе
      </div>

      <div class="time-description">
        Расстояние не имеет значения
      </div>

    </div>

    <button
      class="start-button"
      onclick="nextFromDistance()"
    >

      Продолжить →

    </button>

  `;

}


function selectDistance(card, distance) {

  userData.distance =
    distance;

  document
    .querySelectorAll(".time-card")
    .forEach(function(item) {

      item.classList.remove("selected");

    });

  card.classList.add("selected");

}


function nextFromDistance() {

  if (!userData.distance) {

    alert("Выбери расстояние 📏");

    return;

  }

  showMoodScreen();

}


/* =========================
   CITY
========================= */

function enterCity() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="showLocationScreen()"
    >

      ← Назад

    </button>

    <div class="emoji">
      🌆
    </div>

    <h1>
      Какой<br>
      город?
    </h1>

    <p class="subtitle">

      Напиши город, в котором
      хочешь провести свой день.

    </p>

    <input
      class="city-input"
      id="cityInput"
      type="text"
      placeholder="Например, Москва"
    >

    <button
      class="start-button"
      onclick="saveCity()"
    >

      Продолжить →

    </button>

  `;

  document
    .getElementById("cityInput")
    .focus();

}


function saveCity() {

  const city =
    document
      .getElementById("cityInput")
      .value
      .trim();

  if (!city) {

    alert(
      "Напиши название города 🙂"
    );

    return;

  }

  userData.city =
    city;

  userData.locationMode =
    "city";

  showCitySearchMode();

}


function showCitySearchMode() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="enterCity()"
    >

      ← Назад

    </button>

    <div class="emoji">
      🏙️
    </div>

    <h1>
      Где искать<br>
      маршрут?
    </h1>

    <p class="subtitle">

      Можно подобрать места рядом
      или посмотреть весь город.

    </p>

    <div
      class="time-card"
      onclick="selectCityMode(this,'Рядом с центром')"
    >

      <div class="time-title">
        📍 Рядом с центром
      </div>

      <div class="time-description">
        Компактный маршрут
      </div>

    </div>

    <div
      class="time-card"
      onclick="selectCityMode(this,'Весь город')"
    >

      <div class="time-title">
        🌆 Весь город
      </div>

      <div class="time-description">
        Ищем лучшие варианты где угодно
      </div>

    </div>

    <button
      class="start-button"
      onclick="nextFromCityMode()"
    >

      Продолжить →

    </button>

  `;

}


function selectCityMode(card, mode) {

  citySearchMode =
    mode;

  document
    .querySelectorAll(".time-card")
    .forEach(function(item) {

      item.classList.remove("selected");

    });

  card.classList.add("selected");

}


function nextFromCityMode() {

  if (!citySearchMode) {

    alert(
      "Выбери, где искать маршрут 🏙️"
    );

    return;

  }

  userData.distance =
    citySearchMode;

  showMoodScreen();

}


/* =========================
   MOOD
========================= */

function showMoodScreen() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="showLocationScreen()"
    >

      ← Назад

    </button>

    <div class="progress">
      Шаг 2 из 6
    </div>

    <div class="emoji">
      ✨
    </div>

    <h1>
      Что тебе<br>
      хочется?
    </h1>

    <p class="subtitle">
      Выбери всё, что подходит.
    </p>

    <div class="choices">

      <button class="choice"
        onclick="toggleMood(this,'Перезагрузиться')">
        🌿 Перезагрузиться
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Время для себя')">
        🫶 Время для себя
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Выпустить энергию')">
        ⚡ Выпустить энергию
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Вдохновиться')">
        🎨 Вдохновиться
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Красиво провести вечер')">
        🍷 Красиво провести вечер
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Свидание')">
        💕 Устроить свидание
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Повеселиться с друзьями')">
        👯 Повеселиться с друзьями
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Узнать что-то новое')">
        🧠 Узнать что-то новое
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Найти красивые места')">
        📸 Найти красивые места
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Интересное событие')">
        🎭 Интересное событие
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Вкусно поесть')">
        🍜 Вкусно поесть
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Шопинг')">
        🛍️ Шопинг
      </button>

      <button class="choice"
        onclick="toggleMood(this,'Необычное приключение')">
        🎲 Необычное приключение
      </button>

      <button class="choice"
        onclick="toggleSurpriseMood(this)">
        ✨ Удиви меня
      </button>

    </div>

    <button
      class="start-button"
      onclick="nextFromMood()"
    >

      Продолжить →

    </button>

  `;

}


function toggleMood(button, mood) {

  if (
    userData.moods.includes("Удиви меня")
  ) {

    userData.moods = [];

    document
      .querySelectorAll(".choice")
      .forEach(function(item) {

        item.classList.remove("selected");

      });

  }

  const index =
    userData.moods.indexOf(mood);

  if (index === -1) {

    userData.moods.push(mood);

    button.classList.add("selected");

  } else {

    userData.moods.splice(index, 1);

    button.classList.remove("selected");

  }

}


function toggleSurpriseMood(button) {

  const index =
    userData.moods.indexOf("Удиви меня");

  if (index === -1) {

    userData.moods =
      ["Удиви меня"];

    document
      .querySelectorAll(".choice")
      .forEach(function(item) {

        item.classList.remove("selected");

      });

    button.classList.add("selected");

  } else {

    userData.moods = [];

    button.classList.remove("selected");

  }

}


function nextFromMood() {

  if (userData.moods.length === 0) {

    alert(
      "Выбери хотя бы один вариант ✨"
    );

    return;

  }

  showCompanyScreen();

}


/* =========================
   COMPANY
========================= */

function showCompanyScreen() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="showMoodScreen()"
    >

      ← Назад

    </button>

    <div class="progress">
      Шаг 3 из 6
    </div>

    <div class="emoji">
      👯
    </div>

    <h1>
      С кем<br>
      отправляемся?
    </h1>

    <p class="subtitle">
      Это поможет подобрать подходящие
      места и активности.
    </p>

    <div class="choices">

      <button class="choice"
        onclick="selectCompany(this,'Один / одна')">
        🧍 Один / одна
      </button>

      <button class="choice"
        onclick="selectCompany(this,'На свидании')">
        💕 На свидании
      </button>

      <button class="choice"
        onclick="selectCompany(this,'С друзьями')">
        👯 С друзьями
      </button>

      <button class="choice"
        onclick="selectCompany(this,'С семьёй')">
        👨‍👩‍👧 С семьёй
      </button>

      <button class="choice"
        onclick="selectCompany(this,'С кем-то особенным')">
        🧑‍🤝‍🧑 С кем-то особенным
      </button>

    </div>

    <button
      class="start-button"
      onclick="nextFromCompany()"
    >

      Продолжить →

    </button>

  `;

}


function selectCompany(button, company) {

  userData.company =
    company;

  document
    .querySelectorAll(".choice")
    .forEach(function(item) {

      item.classList.remove("selected");

    });

  button.classList.add("selected");

}


function nextFromCompany() {

  if (!userData.company) {

    alert(
      "Выбери, с кем ты отправляешься 🙂"
    );

    return;

  }

  showBudgetScreen();

}


/* =========================
   BUDGET
========================= */

function showBudgetScreen() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="showCompanyScreen()"
    >

      ← Назад

    </button>

    <div class="progress">

    </div>

    </div>

    <div class="budget-card"

      <div class="budget-title">

      </div>
    </div>

    <div class="budget-card"
      onclick="selectBudget(this,'1 500–3 000 ₽')">

        💸 1 500–3 000 ₽
      </div>
    </div>

    <div class="budget-card"
      onclick="selectBudget(this,'3 000–5 000 ₽')">
      <div class="budget-title">
        💸 3 000–5 000 ₽
      </div>
    </div>

    <div class="budget-card"
      onclick="selectBudget(this,'5 000–10 000 ₽')">
      <div class="budget-title">
        💎 5 000–10 000 ₽
      </div>
    </div>

    <div class="budget-card"

    </div>

    <button

function selectBudget(card, budget) {

  userData.budget =
    budget;

  document
    .querySelectorAll(".budget-card")
    .forEach(function(item) {

    });

function nextFromBudget() {

  if (!userData.budget) {

    alert("Выбери бюджет 💰");

    return;

  }

}


/* =========================
   TIME
========================= */

function showTimeScreen() {

  document.getElementById("hero").innerHTML = `

    <button
      class="back-button"
      onclick="showBudgetScreen()"
    >

      ← Назад

    </button>

    <div class="progress">
      Шаг 5 из 6
    </div>

    <h1>

    </h1>

    <p class="subtitle">

    </p>

    <div class="time-card"

      </div>
    </div>

    <div class="time-card"

      </div>
    </div>

    <div class="time-card"

        🌿 2–4 часа
      </div>
    </div>

    <div class="time-card"
      onclick="selectTime(this,'4–6 часов')">

    </div>

    <div class="time-card"

    <div class="time-card"
      onclick="selectTime(this,'До позднего вечера')">

function selectTime(card, time) {

  userData.time =

  document
    .querySelectorAll(".time-card")
    .forEach(function(item) {

      item.classList.remove("selected");

    });

  card.classList.add("selected");

}


function nextFromTime() {

  if (!userData.time) {

    alert(

  showInterestScreen();

}

function toggleInterest(button, interest) {

  if (
    userData.interests.includes("Выбери за меня")
  ) {

    userData.interests = [];

    document
      .querySelectorAll(".choice")
      .forEach(function(item) {

        item.classList.remove("selected");

      });

  }

  const index =
    userData.interests.indexOf(interest);

  if (index === -1) {

    userData.interests.push(interest);

    button.classList.add("selected");

  } else {

    userData.interests.splice(index, 1);

    button.classList.remove("selected");

  }

}


function toggleSurpriseInterest(button) {

  const index =
    userData.interests.indexOf("Выбери за меня");

  if (index === -1) {

    userData.interests =
      ["Выбери за меня"];

    document
      .querySelectorAll(".choice")
      .forEach(function(item) {

        item.classList.remove("selected");

      });

    button.classList.add("selected");

  } else {

    userData.interests = [];

    button.classList.remove("selected");

  }

}


/* =========================
   SEND TO BACKEND
========================= */

async function finishQuestionnaire() {

  if (userData.interests.length === 0) {

    alert(
      "Выбери хотя бы один интерес 🎯"
    );

    return;

  }

  const hero =
    document.getElementById("hero");

  hero.innerHTML = `

    <div class="emoji">
      🗺️
    </div>

    <h1>
      Создаём<br>
      маршрут...
    </h1>

    <p class="subtitle">
      Отправляем твои предпочтения.
      Это может занять несколько секунд.
    </p>

    <div class="loading">
      ⏳ Подключаемся к Kuda...
    </div>

  `;


  const payload = {

    city:
      userData.city || null,

    latitude:
      userData.latitude,

    longitude:
      userData.longitude,

    moods:
      userData.moods,

    company:
      userData.company,

    budget:
      userData.budget,

    time:
      userData.time,

    interests:
      userData.interests,

    distance:
      userData.distance

  };


  try {

    const response =
      await fetch(
        BACKEND_URL + "/route",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)

        }
      );


    const text =
      await response.text();


    let result;


    try {

      result =
        JSON.parse(text);

    } catch (e) {

      throw new Error(
        "Сервер вернул неправильный ответ."
      );

    }


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Сервер вернул ошибку."
      );

    }


    if (
      result.status !== "success"
    ) {

      throw new Error(
        result.error ||
        "Не удалось создать запрос."
      );

    }


    showResult(result);


  } catch (error) {

    console.error(
      "Kuda error:",
      error
    );


    hero.innerHTML = `

      <div class="emoji">
        😔
      </div>

      <h1>
        Что-то<br>
        пошло не так
      </h1>

      <div class="error-box">

        Не удалось связаться
        с сервером Kuda.

        <br><br>

        <small>
          ${escapeHtml(error.message)}
        </small>

      </div>

      <button
        class="start-button"
        onclick="finishQuestionnaire()"
      >

        🔄 Попробовать ещё раз

      </button>

    `;

  }

}

========================= */

function showResult(result) {

  const request =

  const locationText =
    userData.locationMode === "nearby"

      ? "📍 По твоей геолокации"

      : "🏙️ " + userData.city;


  document.getElementById("hero").innerHTML = `

    <button

    </button>

  `;

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
